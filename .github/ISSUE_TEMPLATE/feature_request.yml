name: Feature request
description: 提议一个新功能或改进。**先看 audit 文档里是否已记**（`docs/audit-2026-10-18.md` §6 是 P1/P2 路线图）。已在路线图里的请直接说「优先做 P1-某项」，避免重复建议。
title: '[feat] '
labels: ['enhancement']
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 提交前

        - [ ] 已查 audit 路线图（`docs/audit-2026-10-18.md` §6）
        - [ ] 已查 CHANGELOG 确认不是已发布的「未发现的」功能
        - [ ] 搜过现有 Issue 列表，没有同类提案

  - type: input
    id: summary
    attributes:
      label: 提案一句话
      description: 解决什么场景下的什么问题
      placeholder: '例：在概览 Tab 加上「vs 上周同时刻」对比数字卡'
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: 影响的 surface
      description: 这个功能主要落在哪个 Tab 或 surface 上？
      options:
        - 概览 Tab（Hero + KPI）
        - 厂商 Tab（计费 + 余额 + 订阅）
        - 用量 Tab（Token + 性能）
        - 趋势 Tab（图表）
        - 费率 Tab（单价表 + 同步）
        - 设置 Tab
        - 侧栏触发卡 / 即时代费条
        - 全局（多个 surface）
        - 服务端（HTTP 端点 / 聚合 / 账本）
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 用户场景
      description: 谁在什么时候想用这个？他/她现在怎么做、怎么不够
      placeholder: |
        当我打开仪表盘想看「这个月会不会爆预算」时，我需要看到「每天花了多少 + 趋势」，但当前只有总数字没有趋势
    validations:
      required: true

  - type: textarea
    id: sketch
    attributes:
      label: 草图 / 描述（可选）
      description: 文字描述、ASCII 草图、参考产品截图皆可
    validations:
      required: false

  - type: textarea
    id: similar
    attributes:
      label: 业内参考（可选）
      description: 哪个产品的哪个功能做了一样的事？链接 + 一句话说明
      placeholder: '例：Vercel 仪表盘的 forecast line'
    validations:
      required: false
